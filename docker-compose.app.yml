# docker-compose file for starting only app services
volumes:
  postgres_data_vol:
    external: false

services:
  app-backend:
    image: niicloudoperation/webmeeting-app:${WEBMEETING_IMAGE_TAG:-latest}
    command:
      - java
      - -jar
      - -Djava.security.egd=file:/dev/./urandom
      - /app/demo.jar
    depends_on:
      - postgresql
    env_file:
      - path: ./default.env
        required: true # default
      - path: ./override.env
        required: false
    restart: always

  app:
    image: nginx:latest
    volumes:
      - ./conf/nginx.app.conf.template:/etc/nginx/templates/nginx.app.conf.template:ro
    depends_on:
      - app-backend
    env_file:
      - path: ./default.env
        required: true # default
      - path: ./override.env
        required: false
    restart: always

  postgresql:
    image: postgres:17
    environment:
      POSTGRES_DB: webmeeting
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in default.env or override.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in default.env or override.env}
    volumes:
      - postgres_data_vol:/var/lib/postgresql/data/
    restart: always

  https-proxy:
    image: nginx:latest
    volumes:
      - ./conf/nginx.app-only.conf.stream-template:/etc/nginx/templates/nginx.app-only.conf.stream-template:ro
      #- ./cert:/etc/nginx/cert:ro
    depends_on:
      - app
    ports:
      - 443:443
    env_file:
      - path: ./default.env
        required: true # default
      - path: ./override.env
        required: false
    restart: always
